<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VOLTECH — Alta de cliente</title>
  <link rel="icon" href="logo.jpeg" />
  <style>
    :root { --bg:#0A0A0A; --panel:#141414; --panel-2:#1a1a1a; --border:#2a2a2a; --border-2:#363636;
      --blue:#0283EB; --blue-hover:#1f97ff; --text:#fff; --muted:#8b8f96; --green:#21c07a; --red:#f2555a; --radius-sm:8px; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:
      radial-gradient(1200px 600px at 70% -10%, rgba(2,131,235,.10), transparent 60%), var(--bg);
      color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
      font-size:14px; -webkit-font-smoothing:antialiased; display:flex; justify-content:center; padding:24px 16px; }
    .card { width:100%; max-width:560px; }
    .head { text-align:center; margin-bottom:22px; }
    .head img { height:48px; margin-bottom:10px; }
    .head h1 { font-size:19px; margin:0 0 6px; font-weight:700; }
    .head p { color:var(--muted); font-size:13.5px; margin:0; }
    .panel { background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:22px; }
    label.fld { display:block; margin-bottom:14px; }
    label.fld > span { display:block; font-size:12.5px; color:var(--muted); margin-bottom:6px; }
    label.fld .req { color:var(--blue); }
    input, textarea { width:100%; background:var(--panel-2); border:1px solid var(--border-2); color:var(--text);
      padding:11px 12px; border-radius:var(--radius-sm); font-size:15px; outline:none; }
    input:focus, textarea:focus { border-color:var(--blue); box-shadow:0 0 0 3px rgba(2,131,235,.12); }
    input::placeholder, textarea::placeholder { color:#6b7178; }
    textarea { resize:vertical; min-height:70px; }
    .row { display:flex; gap:12px; }
    .row > * { flex:1; min-width:0; }
    .btn { width:100%; margin-top:6px; background:var(--blue); border:1px solid var(--blue); color:#fff;
      padding:13px; border-radius:var(--radius-sm); font-size:15px; font-weight:600; cursor:pointer; }
    .btn:hover { background:var(--blue-hover); }
    .btn:disabled { opacity:.6; cursor:not-allowed; }
    .msg { padding:11px 13px; border-radius:var(--radius-sm); font-size:13.5px; margin-bottom:14px; display:none; }
    .msg.err { display:block; background:rgba(242,85,90,.12); border:1px solid rgba(242,85,90,.35); color:#ff9ea1; }
    .foot { text-align:center; color:#6b7178; font-size:12px; margin-top:16px; }
    .done { text-align:center; padding:20px 0; }
    .done .check { width:60px; height:60px; border-radius:50%; background:rgba(33,192,122,.14); color:var(--green);
      display:grid; place-items:center; margin:0 auto 16px; font-size:30px; }
    .done h2 { font-size:18px; margin:0 0 8px; }
    .done p { color:var(--muted); font-size:14px; margin:0; }
    @media (max-width:480px) { .row { flex-direction:column; gap:0; } }
  </style>
</head>
<body>
  <div class="card">
    <div class="head">
      <img src="logo.jpeg" alt="Voltech" />
      <h1>Registro de cliente</h1>
      <p>Completá tus datos y nuestro equipo los tendrá cargados para agilizar tu presupuesto.</p>
    </div>
    <div class="panel" id="panel">
      <div class="msg" id="msg"></div>
      <form id="form">
        <label class="fld"><span>Nombre / Razón social <span class="req">*</span></span>
          <input id="name" required maxlength="200" placeholder="Ej: Juan Pérez / Aberturas del Sur SRL" /></label>
        <div class="row">
          <label class="fld"><span>CUIT / DNI</span>
            <input id="taxId" inputmode="numeric" maxlength="40" placeholder="Solo números" /></label>
          <label class="fld"><span>Persona de contacto</span>
            <input id="contact" maxlength="200" placeholder="Nombre y apellido" /></label>
        </div>
        <div class="row">
          <label class="fld"><span>Teléfono</span>
            <input id="phone" type="tel" inputmode="tel" maxlength="40" placeholder="Ej: 11 5555 5555" /></label>
          <label class="fld"><span>WhatsApp</span>
            <input id="whatsapp" type="tel" inputmode="tel" maxlength="40" placeholder="Ej: 11 5555 5555" /></label>
        </div>
        <label class="fld"><span>Email</span>
          <input id="email" type="email" inputmode="email" autocapitalize="off" maxlength="200" placeholder="tucorreo@ejemplo.com" /></label>
        <div class="row">
          <label class="fld"><span>Dirección</span>
            <input id="address" maxlength="300" placeholder="Calle y número" /></label>
          <label class="fld"><span>Localidad</span>
            <input id="city" maxlength="200" placeholder="Ciudad / Partido" /></label>
        </div>
        <label class="fld"><span>Dirección de instalación (si difiere)</span>
          <input id="installAddress" maxlength="300" placeholder="Dónde se instalaría el portón" /></label>
        <label class="fld"><span>Comentarios</span>
          <textarea id="notes" maxlength="1000" placeholder="Contanos qué necesitás (opcional)"></textarea></label>
        <button class="btn" id="submit" type="submit">Enviar mis datos</button>
      </form>
    </div>
    <div class="foot">VOLTECH — Presupuestos &amp; Gestión</div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const form = $('form'), msg = $('msg'), btn = $('submit');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      msg.className = 'msg';
      const body = {};
      ['name','taxId','contact','phone','whatsapp','email','address','city','installAddress','notes']
        .forEach((k) => body[k] = $(k).value.trim());
      if (!body.name) { msg.className = 'msg err'; msg.textContent = 'Por favor ingresá tu nombre o razón social.'; return; }
      btn.disabled = true; btn.textContent = 'Enviando…';
      try {
        const res = await fetch('/api/public/intake', {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || 'No se pudo enviar. Intentá de nuevo.');
        $('panel').innerHTML = `<div class="done">
          <div class="check">&#10003;</div>
          <h2>¡Datos enviados!</h2>
          <p>Gracias, ${body.name.replace(/[<>&"]/g, '')}. Nuestro equipo ya tiene tus datos. Nos pondremos en contacto a la brevedad.</p></div>`;
      } catch (err) {
        msg.className = 'msg err'; msg.textContent = err.message;
        btn.disabled = false; btn.textContent = 'Enviar mis datos';
      }
    });
  </script>
</body>
</html>
